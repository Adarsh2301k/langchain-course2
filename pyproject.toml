version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Adarsh Kesharwani", email = "adarsh2301k@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.4.9",
